# Rift Hub — Kamal deployment configuration
service: rift-hub

# GitHub Container Registry — push images here
image: ghcr.io/synth/rift-hub

# Production servers
servers:
  web:
    - hub.synth.dev
  job:
    hosts:
      - hub.synth.dev
    cmd: bin/jobs

# SSL via Let's Encrypt + Caddy proxy
proxy:
  ssl: true
  host: hub.synth.dev
  healthcheck:
    interval: 5
    path: /up
    max_retries: 3

# Container registry
registry:
  server: ghcr.io
  username: synth
  password:
    - KAMAL_REGISTRY_PASSWORD

# Environment variables
env:
  secret:
    - RAILS_MASTER_KEY
    - KAMAL_REGISTRY_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    JOB_CONCURRENCY: 3
    WEB_CONCURRENCY: 2
    DB_HOST: hub-db
    RIFT_DB_PATH: /rails/.rift/state.db
    RAILS_LOG_LEVEL: info

# Aliases for bin/kamal
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  db: app exec --interactive --reuse "bin/rails db"

# Persistent volumes
volumes:
  - "hub_storage:/rails/storage"
  - "hub_rift_data:/rails/.rift"

# Asset path for zero-downtime deploys
asset_path: /rails/public/assets

# Image builder
builder:
  arch: amd64
  args:
    RUBY_VERSION: ruby-4.0.4

# Database accessory (single-node: runs alongside the app on the same server)
accessories:
  db:
    image: valkey/valkey:8-alpine
    host: hub.synth.dev
    port: 6379
    directories:
      - data:/data

# SSH
ssh:
  user: app

# Healthcheck path used by Kamal
healthcheck:
  path: /up
  port: 80
